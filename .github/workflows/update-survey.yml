# Pulls the Google Form responses, matches them to courses, and updates verified.json
# (the "Student verified" badges). Runs once a day (about 6 AM Austin time) and from the Actions tab
# ("Run workflow"). A commit to main makes GitHub Pages rebuild the live site.
#
# Setup: Settings -> Secrets and variables -> Actions -> Variables -> New repository variable
#   Name:  SURVEY_CSV_URL
#   Value: a link that downloads the responses sheet as CSV, either
#          https://docs.google.com/spreadsheets/d/<SHEET_ID>/export?format=csv&gid=0
#          (sheet shared as "Anyone with the link: Viewer"), or a File -> Share -> Publish to web CSV link.
# A secret with the same name also works and takes priority.
#
# The job logs only counts, never response text, because Actions logs on a public repo are public.

name: Update survey results

on:
  schedule:
    - cron: "17 11 * * *"   # 11:17 UTC = 6:17 AM CDT (5:17 AM after daylight saving ends)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: survey-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # Always start from the newest version of the site, even on a "Re-run" of an older run.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Download form responses
        id: fetch
        env:
          SURVEY_CSV_URL: ${{ secrets.SURVEY_CSV_URL || vars.SURVEY_CSV_URL }}
        run: |
          if [ -z "$SURVEY_CSV_URL" ]; then
            echo "::warning::SURVEY_CSV_URL is not set yet, so there is nothing to download. See the setup notes at the top of this file."
            echo "ok=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          curl -fsSL --retry 3 --max-time 60 "$SURVEY_CSV_URL" -o "$RUNNER_TEMP/responses.csv"
          if head -c 300 "$RUNNER_TEMP/responses.csv" | grep -qi "<html"; then
            echo "::error::Google returned a web page instead of CSV. The sheet probably isn't shared as 'Anyone with the link' or published to the web."
            exit 1
          fi
          echo "Downloaded $(($(wc -l < "$RUNNER_TEMP/responses.csv") - 1)) response rows"
          echo "ok=true" >> "$GITHUB_OUTPUT"

      # Match the responses against the newest site data and publish. If something else updates
      # the site in the meantime, start over from that newer version (up to 3 tries) instead of failing.
      - name: Match responses to courses and publish
        if: steps.fetch.outputs.ok == 'true'
        env:
          BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch --quiet origin "$BRANCH"
            git reset --quiet --hard "origin/$BRANCH"
            python3 .github/scripts/survey_import.py "$RUNNER_TEMP/responses.csv" . --min 1 --quiet
            if git diff --quiet -- verified.json; then
              echo "No new survey results. The site is already up to date."; exit 0
            fi
            git add verified.json
            git commit --quiet -m "Update student survey results"
            if git push --quiet origin "HEAD:$BRANCH"; then
              echo "Published new survey results."; exit 0
            fi
            echo "The site changed while this ran; trying again from the newest version ($attempt of 3)."
            sleep $((attempt * 5))
          done
          echo "::error::Couldn't publish after 3 tries. Run the workflow again in a minute."
          exit 1
